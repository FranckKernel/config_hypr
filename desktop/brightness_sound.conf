$altMod =  ALT



bindl = , XF86AudioPlay, exec, $HOME/.config/hypr/scripts/youtube_music_controller.sh video play-pause
bindl = , XF86AudioNext, exec, $HOME/.config/hypr/scripts/youtube_music_controller.sh video next
bindl = , XF86AudioPrev, exec, $HOME/.config/hypr/scripts/youtube_music_controller.sh video previous

# bindl = $altMod&Control_L, Left,  exec, $HOME/.config/hypr/scripts/youtube_music_controller.sh music previous
# bindl = $altMod&Control_L, Right, exec,  $HOME/.config/hypr/scripts/youtube_music_controller.sh music next
# bindl = $altMod&Control_L, Up,    exec, $HOME/.config/hypr/scripts/youtube_music_controller.sh music play-pause
# bindl = $altMod&Control_L, Down,  exec, $HOME/.config/hypr/scripts/youtube_music_controller.sh music stop


bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# remove the keyboard volume spam (for x11 only so kinda useless)
exec = xmodmap -e "keycode 122 = NoSymbol"
exec = xmodmap -e "keycode 123 = NoSymbol"

# Ignore volume keys completely
bind=,XF86AudioLowerVolume,exec, echo "Blocked" >> /dev/null
bind=,XF86AudioRaiseVolume,exec, echo "Blocked" >> /dev/null




